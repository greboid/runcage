name: pr

on:
  pull_request:

jobs:
  check:
    runs-on: alpine
    steps:
      - uses: actions/toolkit/git-checkout@master
      - uses: actions/toolkit/go-setup@master
      - uses: actions/toolkit/go-test@master
      - name: Test hook memory protections
        run: GOEXPERIMENT=runtimesecret go test ./internal/injection
