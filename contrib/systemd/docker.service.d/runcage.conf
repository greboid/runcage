# Unseal the Run cage age identity once per Docker start into Docker's
# systemd credential store (/run/credentials/docker.service, noswap tmpfs),
# so containers do not each unseal it. Imported from the credstore
# directories (/etc/credstore.encrypted, /etc/credstore, ...); a missing
# credential is skipped rather than failing Docker.
[Service]
ImportCredential=age-key
